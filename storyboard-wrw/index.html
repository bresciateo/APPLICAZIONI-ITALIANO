<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Storyboard – Scriviamo una storia</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#263242;background:#f4f6f8}*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:1260px;margin:auto;background:white;padding:25px;border-radius:16px;box-shadow:0 5px 25px #172c4212}h1{color:#bb7905;margin:0 0 5px;font-size:clamp(24px,3vw,34px)}.subtitle{color:#687785;margin:0 0 22px}.titlefield{width:min(100%,560px);padding:11px;border:1px solid #c9d1da;border-radius:8px;font-size:16px;margin-top:5px}label{font-size:13px;font-weight:650}.board{overflow-x:auto;padding:6px 0 16px}.board-row{display:flex;align-items:stretch;width:max-content;min-width:100%}.rowlabel{width:112px;min-width:112px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;font-weight:800;padding:8px;line-height:1.5}.tile{width:207px;min-height:215px;border:1px solid #515e6d;margin-right:-1px;background:#fff;display:flex;flex-direction:column;padding:11px;gap:8px}.tile:focus-within{outline:2px solid #3975aa;outline-offset:-2px;z-index:1}.tile .tag{font-size:11px;text-transform:uppercase;letter-spacing:.2px;font-weight:800;overflow-wrap:anywhere;color:#374757}.tile textarea{width:100%;flex:1;min-height:140px;resize:vertical;border:0;background:transparent;outline:0;font:14px/1.55 system-ui;color:#263242}.tile textarea::placeholder{color:#8e9aa4}.tile select{width:100%;min-width:0;background:#f6f8fa;border:1px solid #cbd3db;border-radius:6px;padding:7px 4px;font-size:12px;color:#263242}.controls{display:flex;gap:5px}.controls button{border:1px solid #c6ced8;border-radius:6px;padding:5px 11px;font-size:13px;background:#f7f8fa;cursor:pointer}.controls button:disabled{opacity:.3;cursor:default}.add{margin:8px 0 20px 112px}.btn{border:1px solid #c9d1da;background:#fff;color:#263242;border-radius:8px;padding:10px 13px;font-size:13px;font-weight:700;cursor:pointer}.btn:hover,.controls button:hover:not(:disabled){background:#edf3f8}.btn.primary{background:#1e649d;color:white;border-color:#1e649d}.bottom{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px}.status{font-size:12px;color:#687785;min-height:20px;margin-top:10px}.hint{margin:0 0 18px;color:#65717c;font-size:13px}.section{margin-top:12px} @media(max-width:540px){body{padding:8px}main{padding:13px}.rowlabel{width:78px;min-width:78px;font-size:10px}.tile{width:180px}.add{margin-left:78px}}@media print{body{padding:0;background:white}main{box-shadow:none;padding:0}.noprint{display:none!important}.board{overflow:visible}.tile{width:177px;min-height:180px;break-inside:avoid}.tile textarea{min-height:130px}.rowlabel{width:95px;min-width:95px}}

/* Aspetto illustrato: cielo, oro e pergamena */
:root{background:#dceeff;color:#3b302b}
body{background:linear-gradient(#b8e0ff,#eff7ff 45%,#f8ebd1);min-height:100vh}
main{padding:0 0 26px;overflow:hidden;border:2px solid #c69b51;background:#fffaf0;max-width:1320px;box-shadow:0 18px 50px #25507c38}
.hero{overflow:hidden;border-bottom:5px solid #d3a34b;background:#92cfff}
.hero img{display:block;width:100%;height:clamp(190px,31vw,340px);object-fit:cover;object-position:center 45%}
.inner{padding:24px clamp(12px,3vw,32px) 0}
h1,.rowlabel,.tile .tag{font-family:Georgia,'Times New Roman',serif}
h1{color:#a33424;font-size:clamp(26px,3.7vw,43px);text-shadow:1px 1px #ffe8a6,2px 2px #bc903c,3px 4px 2px #6d3b2a55}
.subtitle{color:#366c99;font-weight:650}
.titlefield{background:#fffefa;border-color:#bf9962}
.rowlabel{font-size:13px;color:#91342d;background:#fff0c9;border:1px solid #c79b58;border-right:0;text-shadow:1px 1px #ffe9a3}
.tile{background:linear-gradient(155deg,#fffefa,#fff2d6);border-color:#b88b4d;min-height:225px;box-shadow:inset 0 0 0 3px #fff9eb}
.tile .tag{font-size:13px;color:#93382c;text-transform:uppercase;letter-spacing:.2px}
.tile textarea{color:#3a332d}
.tile select,.btn,.controls button{background:#fff3d5;border-color:#be9658;color:#614224}
.btn:hover,.controls button:hover:not(:disabled){background:#f5dfb4}
.btn.primary{background:#286caa;border-color:#286caa;color:white}
.tile:focus-within{outline:3px solid #3186ce;outline-offset:-3px}
@media(max-width:540px){body{padding:7px}.inner{padding:14px 9px 0}.hero img{height:188px}.rowlabel{font-size:10px}}
@media print{body{background:white}main{border:0;box-shadow:none}.hero{display:none}.inner{padding:0}.rowlabel,.tile{background:white;color:black;box-shadow:none}h1{text-shadow:none;color:black}}
</style></head><body><main><div class="hero"><img src="copertina-wrw.png" alt="Libro aperto da cui volano parole e uccelli colorati"></div><div class="inner"><h1>Storyboard (scriviamo una storia)</h1><p class="subtitle">Laboratorio di scrittura · Progetta la tua storia</p><div class="noprint"><label for="story-title">Titolo della storia</label><br><input id="story-title" class="titlefield" placeholder="Scrivi il titolo della tua storia..." autocomplete="off"><p class="hint">Scrivi nei riquadri. Usa i menu per scegliere le sezioni e le frecce per spostarle.</p></div><div class="board"><div class="board-row"><div class="rowlabel">PARTE<br>INIZIALE</div><div id="initial" style="display:flex"></div></div><div class="add noprint"><button class="btn" id="add-initial">＋ Aggiungi riquadro iniziale</button></div><div class="board-row"><div class="rowlabel">PARTE<br>CENTRALE</div><div id="central" style="display:flex"></div></div><div class="add noprint"><button class="btn" id="add-central">＋ Aggiungi riquadro centrale</button></div><div class="board-row"><div class="rowlabel">PARTE<br>FINALE</div><div id="final" style="display:flex"></div></div></div><div class="bottom noprint"><button class="btn primary" id="save">Salva</button><button class="btn" id="export">Esporta testo</button><button class="btn" id="backup">Scarica progetto</button><button class="btn" id="import">Apri progetto salvato</button><button class="btn" id="print">Stampa</button><button class="btn" id="reset">Ricomincia</button><input id="file" type="file" accept="application/json,.json" hidden></div><div id="status" class="status noprint" role="status" aria-live="polite"></div></div></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);const names=['Evento principale','Descrizione dei luoghi','Descrizione delle emozioni','Descrizione delle persone'];const initialNames=['Incipit','Presentazione dei personaggi','Presentazione del luogo','Situazione iniziale','Altro'];const key='storyboard-wrw-standalone-v1';let counter=100;
const fresh=()=>({title:'',initial:[{id:1,name:'Incipit',text:'',fixed:true}],central:names.map((name,i)=>({id:i+2,name,text:''})),final:[{id:6,name:'Conclusione',text:'',fixed:true}]});
let data=fresh();try{const saved=JSON.parse(localStorage.getItem(key));if(valid(saved)){data=saved;counter=Math.max(100,...['initial','central','final'].flatMap(k=>data[k].map(p=>Number(p.id)||0)))}}catch(e){}
function valid(obj){return obj&&['initial','central','final'].every(k=>Array.isArray(obj[k]))&&typeof obj.title==='string'}
function el(t,cl,text){const x=document.createElement(t);if(cl)x.className=cl;if(text!==undefined)x.textContent=text;return x}
function save(){data.title=$('story-title').value;try{localStorage.setItem(key,JSON.stringify(data));$('status').textContent='Modifiche salvate in questo browser'}catch(e){$('status').textContent='Salvataggio automatico non disponibile: scarica il progetto per conservarlo.'}}
function move(group,i,offset){const j=i+offset,arr=data[group];if(j<0||j>=arr.length||arr[j].fixed)return;[arr[i],arr[j]]=[arr[j],arr[i]];render();save()}
function renderGroup(group){const host=$(group),items=data[group];host.replaceChildren();items.forEach((item,i)=>{const tile=el('div','tile');const tag=el('div','tag',item.name);if(!item.fixed){const select=el('select');select.setAttribute('aria-label','Categoria del riquadro '+(i+1));const options=group==='central'?names:initialNames;[...new Set([...options,item.name])].forEach(n=>{const option=el('option','',n);option.value=n;select.append(option)});select.value=item.name;select.addEventListener('change',()=>{item.name=select.value;tag.textContent=item.name;save()});const controls=el('div','controls noprint');for(const [symbol,delta] of [['←',-1],['→',1]]){const b=el('button','',symbol);b.type='button';b.title=delta<0?'Sposta a sinistra':'Sposta a destra';b.disabled=(delta<0&&i===0)||(delta>0&&i===items.length-1)||(delta<0&&items[i-1]?.fixed);b.addEventListener('click',()=>move(group,i,delta));controls.append(b)}const remove=el('button','','×');remove.type='button';remove.title='Elimina riquadro';remove.addEventListener('click',()=>{if(confirm('Eliminare questo riquadro e il testo che contiene?')){items.splice(i,1);render();save()}});controls.append(remove);tile.append(select,controls)}const area=el('textarea');area.value=item.text||'';area.placeholder='Scrivi qui...';area.setAttribute('aria-label',item.name);area.addEventListener('input',()=>{item.text=area.value;save()});tile.append(tag,area);host.append(tile)})}
function render(){renderGroup('initial');renderGroup('central');renderGroup('final')}
function download(text,name,mime){const blob=new Blob([text],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
$('story-title').value=data.title||'';$('story-title').addEventListener('input',save);
$('add-initial').addEventListener('click',()=>{data.initial.push({id:++counter,name:'Situazione iniziale',text:''});render();save()});
$('add-central').addEventListener('click',()=>{data.central.push({id:++counter,name:'Evento principale',text:''});render();save()});
$('save').addEventListener('click',save);
$('export').addEventListener('click',()=>{save();const out=[data.title||'LA MIA STORIA'];for(const [k,heading] of [['initial','PARTE INIZIALE'],['central','PARTE CENTRALE'],['final','PARTE FINALE']]){out.push('\n'+heading);data[k].forEach(x=>out.push('\n'+x.name.toUpperCase()+'\n'+(x.text||'')))}download(out.join('\n'),'storyboard.txt','text/plain;charset=utf-8')});
$('backup').addEventListener('click',()=>{save();download(JSON.stringify(data,null,2),'storyboard-progetto.json','application/json')});
$('import').addEventListener('click',()=>$('file').click());$('file').addEventListener('change',async(e)=>{const file=e.target.files?.[0];if(!file)return;try{const parsed=JSON.parse(await file.text());if(!valid(parsed))throw Error('Formato non valido');if(!confirm('Aprire questo progetto? Il lavoro attuale sarà sostituito.'))return;data=parsed;counter=Math.max(100,...['initial','central','final'].flatMap(k=>data[k].map(p=>Number(p.id)||0)));$('story-title').value=data.title;render();save()}catch(error){alert('Impossibile aprire il file: '+error.message)}finally{e.target.value=''}});
$('print').addEventListener('click',()=>window.print());$('reset').addEventListener('click',()=>{if(!confirm('Cancellare tutto lo storyboard?'))return;data=fresh();$('story-title').value='';render();save()});render();
})();
</script></body></html>
