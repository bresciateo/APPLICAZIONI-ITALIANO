<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Una lettera per… — Le app del maestro Teo</title>
<style>
:root{--ink:#4d3022;--wine:#9d3528;--gold:#c99641;--paper:#fffbf0;--muted:#755f50;--sky:#e8f3f4}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:linear-gradient(145deg,#d7ebf3,#faf5e7 55%,#e8d7b8);min-height:100vh}main{max-width:1480px;margin:auto;padding:22px 18px 60px}.hero{border:4px solid #ddbd77;border-radius:24px;overflow:hidden;background:#f7e5c0;box-shadow:0 15px 40px #5e402429;position:relative}.hero>a{display:block}.hero img{width:100%;max-height:310px;object-fit:cover;object-position:center 48%;display:block}.hero a:focus-visible{outline:5px solid #2670b5;outline-offset:-5px}.hero-note{position:absolute;bottom:13px;right:15px;background:#fff9e7ef;border:1px solid #c99641;border-radius:20px;padding:7px 12px;font-size:12px;font-weight:700;pointer-events:none}.intro{margin:23px 0 19px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}.brand{font-family:Georgia,'Times New Roman',serif;font-weight:900;font-size:clamp(34px,5vw,59px);line-height:1.05;color:var(--wine);text-shadow:1px 2px 0 #fce4a8,3px 4px 0 #ab792c,5px 6px 12px #6d422e56;margin:0}.small{font-size:13px;color:var(--muted)}.home{display:inline-flex;align-items:center;gap:8px;text-decoration:none;background:#fff9ea;border:2px solid #bd8e43;border-radius:12px;color:#70401e;font-weight:800;padding:10px 15px}.home:hover{background:#ffecc4}.paper{background:#fffdf6;border:2px solid #d5b67b;border-radius:19px;padding:22px;box-shadow:0 11px 30px #6c47201c}.meta{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-weight:800;color:#75502b}.field input{width:100%;font:inherit;border:1.5px solid #d0ad71;border-radius:10px;background:#fffcf5;padding:12px;color:var(--ink)}.section-label{font:900 clamp(21px,2.2vw,29px) Georgia,serif;color:#86511f;margin:27px 0 10px}.section-label:first-of-type{margin-top:8px}.board-row{display:flex;align-items:stretch;gap:0;min-width:max-content}.row-label{width:110px;flex:none;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:850;line-height:1.5;font-size:12px;padding:9px;color:#764c2a}.board-scroll{overflow-x:auto;padding:3px 2px 13px;scrollbar-color:#bd965a #f3ead8}.tiles{display:flex}.tile{width:235px;min-height:235px;flex:none;border:1.5px solid #ab814e;background:linear-gradient(165deg,#fff9e8,#fffefa);padding:12px;display:flex;flex-direction:column;gap:9px}.tile:first-child{border-radius:8px 0 0 8px}.tile:last-child{border-radius:0 8px 8px 0}.tile:only-child{border-radius:8px}.tile:focus-within{outline:2px solid #a94130;outline-offset:-3px}.tag{font:900 15px Georgia,serif;color:#9d3528;letter-spacing:.2px;min-height:20px}.tile textarea{flex:1;width:100%;min-height:160px;resize:vertical;border:none;outline:none;background:transparent;font:15px/1.55 system-ui,sans-serif;color:#362b26}.tile textarea::placeholder{color:#8f7e6a;opacity:1;font-style:italic}.tile select{border:1px solid #cda76c;background:#fffaf0;color:#573927;padding:7px;border-radius:7px;max-width:100%;font-weight:700}.mini-actions{display:flex;gap:5px}.mini-actions button{background:#fff3d9;border:1px solid #cfab76;color:#78451c;border-radius:6px;font-weight:800;padding:5px 10px;cursor:pointer}.mini-actions button:disabled{opacity:.3;cursor:default}.btn{font:750 14px system-ui,sans-serif;cursor:pointer;border:1px solid #ac7c3a;border-radius:10px;background:#fff4d9;color:#6b3a20;padding:11px 14px}.btn:hover{background:#fce5b8}.btn-primary{background:#a33c2c;border-color:#a33c2c;color:white}.btn-primary:hover{background:#812d22}.add{margin:7px 0 9px 110px}.footer-actions{border-top:1px solid #e2cba3;margin-top:20px;padding-top:18px;display:flex;flex-wrap:wrap;gap:9px;align-items:center}.status{font-size:12px;color:#6b6258}.signature{border:1px dashed #bd975b;border-radius:10px;display:flex;align-items:center;gap:10px;background:#fff8e6;padding:15px;margin-top:14px;color:#8b452b;font:800 18px Georgia,serif;max-width:350px}.postscript{margin-top:10px}.postscript .tile{min-height:170px}.postscript .tile textarea{min-height:105px}.hidden{display:none!important}.separator{border:0;border-top:1px solid #ead9b9;margin-top:12px}button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #2e76bb;outline-offset:2px} @media(max-width:650px){main{padding:10px 8px 30px}.paper{padding:12px}.hero img{max-height:210px}.hero-note{font-size:10px}.meta{grid-template-columns:1fr}.row-label{width:73px;font-size:10px}.add{margin-left:73px}.tile{width:205px}.brand{font-size:36px}}@media print{body{background:white}main{padding:0}.hero,.home,.footer-actions,.add,.mini-actions,.tile select,.hero-note{display:none!important}.paper{border:0;box-shadow:none}.board-scroll{overflow:visible}.tiles{flex-wrap:wrap}.tile{break-inside:avoid;width:210px}.tile textarea{height:auto;min-height:125px}}
</style>
</head>
<body><main>
<header class="hero"><a href="../" aria-label="Torna alla homepage Le app del maestro Teo" title="Torna a Le app del maestro Teo"><img src="lettera-fantasy.png" alt="Una busta vola verso una cassetta delle lettere in un paesaggio di campagna"></a><span class="hero-note">↖ Clicca sull'immagine per tornare alle app</span></header>
<div class="intro"><div><h1 class="brand">Una lettera per…</h1><p class="small">Il mio storyboard per scrivere una lettera · Laboratorio di scrittura</p></div><a class="home" href="../">⌂ Torna alle app</a></div>
<div class="paper"><div class="meta"><div class="field"><label for="place">Luogo</label><input id="place" placeholder="Dove scrivi questa lettera?"></div><div class="field"><label for="date">Data</label><input id="date" placeholder="Quando scrivi questa lettera?"></div></div>
<h2 class="section-label">Parte iniziale</h2><div class="board-scroll"><div class="board-row"><div class="row-label">PARTE<br>INIZIALE</div><div class="tiles" id="initial"></div></div></div>
<h2 class="section-label">Parte centrale</h2><div class="board-scroll"><div class="board-row"><div class="row-label">PARTE<br>CENTRALE</div><div class="tiles" id="central"></div></div></div><div class="add"><button class="btn" id="add-central">＋ Aggiungi un riquadro centrale</button></div>
<h2 class="section-label">Parte finale</h2><div class="board-scroll"><div class="board-row"><div class="row-label">PARTE<br>FINALE</div><div class="tiles" id="final"></div></div></div>
<div class="add"><button class="btn" id="add-ps">＋ Aggiungi post scriptum</button><button class="btn hidden" id="remove-ps">× Elimina post scriptum</button></div><div id="ps-wrap" class="board-scroll postscript hidden"><div class="board-row"><div class="row-label">P.S.</div><div class="tiles" id="ps"></div></div></div>
<div class="signature">✒ Ricordati la firma!</div>
<div class="footer-actions"><button class="btn btn-primary" id="save">Salva</button><button class="btn" id="word">↓ Esporta in Word (.docx)</button><button class="btn" id="export-project">↓ Scarica progetto</button><button class="btn" id="import-project">↑ Apri progetto salvato</button><input id="project-file" class="hidden" type="file" accept="application/json,.json"><button class="btn" id="reset">Ricomincia</button><span class="status" id="status" aria-live="polite"></span></div>
</div></main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const suggestions={
 'Incipit':'A chi stai scrivendo? Perché hai deciso di scrivere questa lettera? Come vuoi rivolgerti a questa persona?',
 'Introduzione':'Vuoi chiedere come sta il destinatario, ringraziarlo per una lettera ricevuta oppure spiegare perché gli stai scrivendo?',
 'Risposte':'A quali domande ricevute vuoi rispondere?',
 'Domande':'Che cosa vorresti sapere dal destinatario?',
 'Racconto':'Quale esperienza o novità vuoi raccontare?',
 'Richieste':'Vuoi chiedere qualcosa al destinatario?',
 'Saluti':'Come vuoi salutare il destinatario? Come vuoi concludere la tua lettera?',
 'Post scriptum':'Hai dimenticato qualcosa che vuoi aggiungere alla lettera?'
};
const middleTypes=['Risposte','Domande','Racconto','Richieste'];
const storageKey='maestro-teo-lettera-v1';
const fresh=()=>({version:1,place:'',date:'',initial:[{type:'Incipit',text:''},{type:'Introduzione',text:''}],central:middleTypes.map(type=>({type,text:''})),final:[{type:'Saluti',text:''}],ps:null});
let data=fresh();try{const raw=localStorage.getItem(storageKey);if(raw){const d=JSON.parse(raw);if(valid(d))data=d}}catch(e){}
function valid(d){return d&&Array.isArray(d.initial)&&Array.isArray(d.central)&&Array.isArray(d.final)&&typeof d.place==='string'&&typeof d.date==='string'}
function notify(s){$('status').textContent=s}
function save(){data.place=$('place').value;data.date=$('date').value;try{localStorage.setItem(storageKey,JSON.stringify(data));notify('Modifiche salvate su questo browser')}catch(e){notify('Salvataggio locale non disponibile: scarica il progetto')}}
function element(tag,klass,content){const el=document.createElement(tag);if(klass)el.className=klass;if(content!==undefined)el.textContent=content;return el}
function render(group,id){const host=$(id);host.replaceChildren();const arr=data[group];arr.forEach((item,i)=>{
const tile=element('div','tile');const title=element('div','tag',item.type);
if(group==='central'){
 const select=element('select');select.setAttribute('aria-label','Tipo del riquadro centrale '+(i+1));middleTypes.forEach(n=>{const opt=element('option','',n);opt.value=n;select.appendChild(opt)});select.value=middleTypes.includes(item.type)?item.type:middleTypes[0];select.onchange=()=>{item.type=select.value;title.textContent=item.type;area.placeholder=suggestions[item.type];save()};
 const tools=element('div','mini-actions');[['←',-1],['→',1]].forEach(([sign,d])=>{const b=element('button','',sign);b.type='button';b.title=d<0?'Sposta prima':'Sposta dopo';b.disabled=i+d<0||i+d>=arr.length;b.onclick=()=>{[arr[i],arr[i+d]]=[arr[i+d],arr[i]];render(group,id);save()};tools.appendChild(b)});
 const remove=element('button','','×');remove.type='button';remove.title='Elimina riquadro';remove.onclick=()=>{if(confirm('Eliminare questo riquadro e il testo che contiene?')){arr.splice(i,1);render(group,id);save()}};tools.appendChild(remove);tile.append(select,tools);
}
const area=element('textarea');area.value=item.text;area.placeholder=suggestions[item.type]||'Scrivi qui…';area.setAttribute('aria-label',item.type);area.oninput=()=>{item.text=area.value;save()};tile.append(title,area);host.appendChild(tile);
})}
function renderPS(){const has=!!data.ps;$('ps-wrap').classList.toggle('hidden',!has);$('add-ps').classList.toggle('hidden',has);$('remove-ps').classList.toggle('hidden',!has);$('ps').replaceChildren();if(!has)return;const tile=element('div','tile');const title=element('div','tag','Post scriptum');const area=element('textarea');area.placeholder=suggestions['Post scriptum'];area.value=data.ps.text;area.setAttribute('aria-label','Post scriptum');area.oninput=()=>{data.ps.text=area.value;save()};tile.append(title,area);$('ps').appendChild(tile)}
function refresh(){$('place').value=data.place;$('date').value=data.date;render('initial','initial');render('central','central');render('final','final');renderPS()}
$('place').oninput=save;$('date').oninput=save;
$('add-central').onclick=()=>{data.central.push({type:'Racconto',text:''});render('central','central');save();let tiles=$('central').querySelectorAll('textarea');tiles[tiles.length-1].focus()};
$('add-ps').onclick=()=>{data.ps={text:''};renderPS();save();$('ps').querySelector('textarea').focus()};
$('remove-ps').onclick=()=>{if(data.ps.text&&!confirm('Eliminare il post scriptum e il suo contenuto?'))return;data.ps=null;renderPS();save()};
$('save').onclick=()=>{save();notify('Lavoro salvato su questo browser')};
function download(blob,name){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2500)}
$('export-project').onclick=()=>{save();download(new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'}),'una-lettera-per-progetto.json')};
$('import-project').onclick=()=>$('project-file').click();
$('project-file').onchange=async()=>{const file=$('project-file').files[0];if(!file)return;try{const candidate=JSON.parse(await file.text());if(!valid(candidate)||!candidate.initial.length||!candidate.final.length||candidate.central.some(x=>!middleTypes.includes(x.type)))throw new Error('Formato non valido');if(!confirm('Aprire il progetto salvato? Sostituirà il lavoro attuale.'))return;data=candidate;refresh();save();notify('Progetto caricato correttamente')}catch(e){alert('Impossibile aprire il progetto: file non valido.')}finally{$('project-file').value=''}};
$('reset').onclick=()=>{if(!confirm('Cancellare questa lettera e iniziarne una nuova? Prima puoi scaricare il progetto.'))return;data=fresh();refresh();save();notify('Nuova lettera pronta')};
// Generazione DOCX autonoma: WordprocessingML in archivio ZIP non compresso, senza servizi esterni.
const enc=new TextEncoder();function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;')}
const p=(text,bold=false)=>'<w:p><w:r>'+(bold?'<w:rPr><w:b/></w:rPr>':'')+'<w:t xml:space="preserve">'+esc(text)+'</w:t></w:r></w:p>';
function docxXML(){let paras=[p('UNA LETTERA PER…',true)];if(data.place||data.date)paras.push(p([data.place,data.date].filter(Boolean).join(', ')));for(const [key,label] of [['initial','PARTE INIZIALE'],['central','PARTE CENTRALE'],['final','PARTE FINALE']]){paras.push(p(label,true));data[key].forEach(s=>{paras.push(p(s.type,true));(s.text||'').split(/\r?\n/).forEach(t=>paras.push(p(t)))})}if(data.ps){paras.push(p('POST SCRIPTUM',true));data.ps.text.split(/\r?\n/).forEach(t=>paras.push(p(t)))}paras.push(p('Firma: ______________________________'));return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>'+paras.join('')+'<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134"/></w:sectPr></w:body></w:document>'}
function crc32(b){let c=0xffffffff;for(const byte of b){c^=byte;for(let i=0;i<8;i++)c=c&1?(c>>>1)^0xedb88320:c>>>1}return(c^0xffffffff)>>>0}
function zip(files){const chunks=[],central=[];let offset=0;const u16=(dv,p,v)=>dv.setUint16(p,v,true),u32=(dv,p,v)=>dv.setUint32(p,v,true);for(const [name,content] of files){const n=enc.encode(name),b=enc.encode(content),crc=crc32(b);const h=new Uint8Array(30+n.length),v=new DataView(h.buffer);u32(v,0,0x04034b50);u16(v,4,20);u16(v,6,0x0800);u16(v,8,0);u32(v,14,crc);u32(v,18,b.length);u32(v,22,b.length);u16(v,26,n.length);h.set(n,30);chunks.push(h,b);const cd=new Uint8Array(46+n.length),d=new DataView(cd.buffer);u32(d,0,0x02014b50);u16(d,4,20);u16(d,6,20);u16(d,8,0x0800);u32(d,16,crc);u32(d,20,b.length);u32(d,24,b.length);u16(d,28,n.length);u32(d,42,offset);cd.set(n,46);central.push(cd);offset+=h.length+b.length}const centralSize=central.reduce((a,b)=>a+b.length,0),end=new Uint8Array(22),dv=new DataView(end.buffer);u32(dv,0,0x06054b50);u16(dv,8,files.length);u16(dv,10,files.length);u32(dv,12,centralSize);u32(dv,16,offset);return new Blob([...chunks,...central,end],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'})}
$('word').onclick=()=>{save();const files=[['[Content_Types].xml','<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>'],['_rels/.rels','<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>'],['word/document.xml',docxXML()]];download(zip(files),'una-lettera-per.docx');notify('Documento Word esportato')};
refresh();
})();
</script></body></html>
