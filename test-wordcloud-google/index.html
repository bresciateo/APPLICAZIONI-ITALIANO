<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prova alternativa GitHub e Google</title>
<style>body{font:16px system-ui,sans-serif;max-width:660px;margin:32px auto;padding:0 18px;color:#243047}button{font:inherit;background:#245dd1;color:#fff;padding:12px 18px;border:0;border-radius:8px}li{padding:4px}</style>
</head><body><h1>Test alternativo di lettura</h1>
<p>Questa pagina usa una pagina HTML di Google Apps Script, invece della risposta JSONP. Nessun accesso Google richiesto dall'interfaccia. Solo dati fittizi.</p>
<button id="refresh">Riprova lettura</button><p id="status">In attesa...</p><ol id="items"></ol>
<script>
const API='https://script.google.com/macros/s/AKfycbxBw94iE1BsRYFZWr20HTca1KfJDtH7tGySrzy3ZnWWPHvOF1cJB4uRbREzfjMepvIc/exec';
const status=document.getElementById('status'),list=document.getElementById('items');
let frame=null,timeout=null;
function read(){
 if(frame)frame.remove();clearTimeout(timeout);list.replaceChildren();status.textContent='Lettura in corso...';
 frame=document.createElement('iframe');frame.title='Servizio di lettura Google';frame.hidden=true;frame.src=API+'?mode=bridge&t='+Date.now();document.body.appendChild(frame);
 timeout=setTimeout(()=>{status.textContent='Nessuna risposta dal servizio: possibile blocco del frame o del collegamento Google.'},12000);
}
window.addEventListener('message',e=>{
 if(!frame||e.source!==frame.contentWindow)return;
 if(e.origin!=='https://script.google.com'&&!e.origin.endsWith('.googleusercontent.com'))return;
 if(!e.data||e.data.kind!=='wc-test-read-v2')return;
 clearTimeout(timeout);const r=e.data.result;
 if(!r?.ok){status.textContent='Errore: '+(r?.error||'sconosciuto');return;}
 status.textContent='Parole ricevute: '+r.count;
 for(const item of r.items){const li=document.createElement('li');li.textContent=item.word;list.appendChild(li)}
});
document.getElementById('refresh').addEventListener('click',read);read();
</script></body></html>
